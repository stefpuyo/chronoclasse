<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chrono EPS Modern</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700;800;900&family=Inter:wght@400;600;700;900&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #080c14;
            color: #f3f4f6;
        }

        .mono-time {
            font-family: 'Chakra Petch', monospace;
            font-variant-numeric: tabular-nums;
        }

        @keyframes pauseGlow {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
                filter: drop-shadow(0 0 14px rgba(250, 204, 21, 0.95));
            }
            50% {
                opacity: 0.3;
                transform: scale(0.98);
                filter: drop-shadow(0 0 3px rgba(250, 204, 21, 0.2));
            }
        }

        .blinking-pause {
            animation: pauseGlow 1.1s cubic-bezier(0.4, 0, 0.6, 1) infinite;
            color: #facc15 !important;
            font-weight: 900;
        }

        /* Thèmes de cartes colorés */
        .card-theme-0 { background: linear-gradient(145deg, #1e1b4b, #2e1065); border-color: #818cf8; }
        .card-theme-1 { background: linear-gradient(145deg, #064e3b, #022c22); border-color: #34d399; }
        .card-theme-2 { background: linear-gradient(145deg, #701a75, #4a044e); border-color: #f0abfc; }
        .card-theme-3 { background: linear-gradient(145deg, #7c2d12, #451a03); border-color: #fb923c; }
        .card-theme-4 { background: linear-gradient(145deg, #1e3a8a, #172554); border-color: #60a5fa; }
        .card-theme-5 { background: linear-gradient(145deg, #831843, #500724); border-color: #fb7185; }
    </style>
</head>
<body class="p-3 md:p-6 min-h-screen flex flex-col justify-between">

    <div>
        <!-- EN-TÊTE PRINCIPAL -->
        <header class="max-w-[1920px] mx-auto mb-4 flex flex-wrap items-center justify-between gap-3 bg-slate-900/90 p-4 rounded-2xl border border-slate-800 shadow-2xl">
            <div class="flex items-center gap-3">
                <div class="p-3 bg-indigo-600 rounded-xl text-white font-black text-2xl shadow-lg shadow-indigo-600/30">
                    ⏱️
                </div>
                <div>
                    <h1 class="text-xl md:text-2xl font-black text-white flex items-center gap-2">
                        CHRONO EPS <span class="text-xs px-2.5 py-1 rounded-full bg-indigo-500/20 text-indigo-400 border border-indigo-500/30 font-bold" id="card-count-badge">6 Chronos</span>
                    </h1>
                    <p class="text-xs text-slate-400 font-medium" id="status-synchro">Prêt - Mode Hors-Ligne / Local</p>
                </div>
            </div>

            <!-- ACTIONS PRINCIPALES & SÉLECTION DU RÔLE -->
            <div class="flex flex-wrap items-center gap-2">
                <button onclick="addNewCard()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-black px-4 py-2 rounded-xl text-xs shadow-lg shadow-indigo-600/30 flex items-center gap-1.5 transition transform active:scale-95">
                    ➕ Ajouter un chrono
                </button>
                <button onclick="openModal('importModal')" class="bg-slate-800 hover:bg-slate-700 text-white font-bold px-3 py-2 rounded-xl text-xs border border-slate-700 transition">
                    📋 Importer Élèves
                </button>
                <button onclick="exportCSV()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-3 py-2 rounded-xl text-xs shadow transition">
                    📊 Export CSV (1 ligne/élève)
                </button>

                <div class="flex bg-slate-950 p-1 rounded-xl border border-slate-800 ml-2">
                    <button onclick="setRole('prof')" id="btn-role-prof" class="px-2.5 py-1 rounded-lg text-xs font-bold bg-indigo-600 text-white">👨‍🏫 PROF</button>
                    <button onclick="setRole('tab1')" id="btn-role-tab1" class="px-2.5 py-1 rounded-lg text-xs font-bold text-slate-400">📱 Tab 1</button>
                    <button onclick="setRole('tab2')" id="btn-role-tab2" class="px-2.5 py-1 rounded-lg text-xs font-bold text-slate-400">📱 Tab 2</button>
                    <button onclick="setRole('tab3')" id="btn-role-tab3" class="px-2.5 py-1 rounded-lg text-xs font-bold text-slate-400">📱 Tab 3</button>
                    <button onclick="setRole('tab4')" id="btn-role-tab4" class="px-2.5 py-1 rounded-lg text-xs font-bold text-slate-400">📱 Tab 4</button>
                </div>
            </div>
        </header>

        <!-- BANDEAU D'ENVOI POUR LES TABLETTES ÉLÈVES -->
        <div id="tab-send-banner" class="hidden max-w-[1920px] mx-auto mb-4 bg-emerald-950/90 border border-emerald-500/50 p-3 rounded-2xl flex items-center justify-between gap-2 shadow-lg">
            <span class="text-xs font-bold text-emerald-200">Mode Tablette Élève actif</span>
            <button onclick="sendDataToProfDirect()" class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black px-6 py-2 rounded-xl text-sm shadow-lg animate-bounce transition">
                🚀 ENVOYER MES RÉSULTATS AU PROF
            </button>
        </div>

        <!-- CONTROLES GLOBAUX (MODE PROF) -->
        <div id="prof-controls" class="max-w-[1920px] mx-auto mb-4 bg-slate-900/60 p-3 rounded-2xl border border-slate-800/80 flex flex-wrap items-center justify-between gap-2">
            <div class="flex items-center gap-2">
                <span class="text-xs font-black uppercase tracking-wider text-slate-400 pl-2">Contrôle Général :</span>
                <button onclick="startAll()" class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black px-4 py-1.5 rounded-lg text-xs shadow transition">▶️ TOUT DÉMARRER</button>
                <button onclick="pauseAll()" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-black px-4 py-1.5 rounded-lg text-xs shadow transition">⏸️ TOUT PAUSER</button>
                <button onclick="resetAllConfirm()" class="bg-rose-500/20 hover:bg-rose-500 text-rose-300 hover:text-white border border-rose-500/30 font-bold px-3 py-1.5 rounded-lg text-xs transition">↺ RAZ Tout</button>
            </div>

            <div class="flex items-center gap-2">
                <span class="text-xs font-bold text-slate-400">% VMA Général :</span>
                <select id="global-vma-select" onchange="setGlobalVMAPercent(this.value)" class="bg-slate-950 text-indigo-300 font-bold text-xs border border-indigo-500/30 rounded-lg px-2 py-1">
                    <option value="80">80 %</option>
                    <option value="90">90 %</option>
                    <option value="100" selected>100 %</option>
                    <option value="110">110 %</option>
                    <option value="120">120 %</option>
                    <option value="130">130 %</option>
                </select>
            </div>
        </div>

        <!-- GRILLE DE CHRONOMÈTRES (3 PAR LIGNE SUR GRAND ÉCRAN POUR UN MAXIMUM DE LISIBILITÉ) -->
        <main class="max-w-[1920px] mx-auto">
            <div id="chrono-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
        </main>
    </div>

    <!-- MODAL : IMPORTATION D'ÉLÈVES -->
    <div id="importModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-700 w-full max-w-lg rounded-2xl p-6 shadow-2xl">
            <h3 class="text-xl font-black text-white mb-2">📋 Copier-Coller Élèves / VMA</h3>
            <p class="text-xs text-slate-400 mb-3">Collez un élève par ligne. Exemple : <code class="bg-slate-950 text-indigo-300 px-1 py-0.5 rounded">Lucas, 13.5</code></p>
            <textarea id="import-text" rows="8" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white font-mono focus:outline-none focus:border-indigo-500 mb-4" placeholder="Emma, 12&#10;Lucas, 13.5&#10;Léa, 11&#10;Hugo, 14"></textarea>
            <div class="flex justify-end gap-2">
                <button onclick="closeModal('importModal')" class="px-4 py-2 bg-slate-800 text-slate-300 font-bold rounded-xl text-xs hover:bg-slate-700">Annuler</button>
                <button onclick="processImport()" class="px-4 py-2 bg-indigo-600 text-white font-black rounded-xl text-xs hover:bg-indigo-500 shadow">Charger les Élèves</button>
            </div>
        </div>
    </div>

    <script>
        let currentRole = 'prof';
        let cards = [];
        const bc = new BroadcastChannel('eps_chrono_channel');

        function createCardObject(id, name = '', vma = '') {
            return {
                id,
                name,
                vma,
                vmaPercent: 100,
                courseCount: 1,
                pauseCount: 0,
                courseTime: 0,
                pauseTime: 0,
                isRunning: false,
                isPaused: false,
                startTime: 0,
                pauseStartTime: 0,
                history: [],
                themeIndex: id % 6
            };
        }

        function initApp() {
            const saved = localStorage.getItem('eps_modern_chronos_v3');
            if (saved) {
                try {
                    cards = JSON.parse(saved);
                    cards.forEach(c => { c.isRunning = false; c.isPaused = false; });
                } catch(e) { createDefaultCards(6); }
            } else {
                createDefaultCards(6);
            }
            renderGrid();
            setInterval(updateActiveTimers, 100);

            bc.onmessage = (event) => {
                if (event.data && event.data.type === 'SYNC_DATA') {
                    mergeReceivedData(event.data.payload);
                }
            };
        }

        function createDefaultCards(count) {
            cards = [];
            for (let i = 0; i < count; i++) {
                cards.push(createCardObject(i));
            }
        }

        function addNewCard() {
            const newId = cards.length;
            cards.push(createCardObject(newId));
            saveData();
            renderGrid();
        }

        function removeCard(index) {
            if (cards.length <= 1) return alert("Vous devez conserver au moins un chrono.");
            if (confirm(`Supprimer la carte de ${cards[index].name || 'l\'élève ' + (index+1)} ?`)) {
                cards.splice(index, 1);
                // Réindexer les IDs
                cards.forEach((c, idx) => c.id = idx);
                saveData();
                renderGrid();
            }
        }

        function saveData() {
            localStorage.setItem('eps_modern_chronos_v3', JSON.stringify(cards));
        }

        function getTargetTimeFormatted(vma, percent) {
            if (!vma || isNaN(vma) || parseFloat(vma) <= 0) return "--:--";
            const speedKmH = (parseFloat(vma) * parseInt(percent)) / 100;
            if (speedKmH <= 0) return "--:--";
            const targetSeconds = 360 / (speedKmH / 3.6);
            const mins = Math.floor(targetSeconds / 60);
            const secs = Math.floor(targetSeconds % 60);
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        function formatTimeDisplay(ms) {
            if (ms <= 0 || isNaN(ms)) return { main: "00:00", ms: ".0" };
            const totalSecs = Math.floor(ms / 1000);
            const mins = Math.floor(totalSecs / 60);
            const secs = totalSecs % 60;
            const tenths = Math.floor((ms % 1000) / 100);
            return {
                main: `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`,
                ms: `.${tenths}`
            };
        }

        function renderGrid() {
            const grid = document.getElementById('chrono-grid');
            grid.innerHTML = '';

            document.getElementById('card-count-badge').innerText = `${cards.length} Chrono${cards.length > 1 ? 's' : ''}`;

            let visibleCards = cards;
            if (currentRole.startsWith('tab')) {
                const tabNum = parseInt(currentRole.replace('tab', ''));
                const perTab = Math.ceil(cards.length / 4);
                const start = (tabNum - 1) * perTab;
                visibleCards = cards.slice(start, start + perTab);
            }

            visibleCards.forEach((card) => {
                const index = card.id;
                const targetTime = getTargetTimeFormatted(card.vma, card.vmaPercent);
                const cTime = formatTimeDisplay(card.courseTime);
                const pTime = formatTimeDisplay(card.pauseTime);

                let badgeText = `Course n°${card.courseCount}`;
                let badgeClass = "bg-black/30 text-emerald-300 border-emerald-500/30";
                
                if (card.isPaused) {
                    badgeText = `Pause n°${card.pauseCount}`;
                    badgeClass = "bg-amber-500/20 text-amber-300 border-amber-500/40";
                }

                const cardEl = document.createElement('div');
                cardEl.className = `card-theme-${card.themeIndex % 6} border-2 rounded-2xl p-4 flex flex-col justify-between shadow-xl relative overflow-hidden`;

                cardEl.innerHTML = `
                    <div>
                        <!-- EN-TÊTE ÉLÈVE + SUPPRESSION -->
                        <div class="flex items-center justify-between gap-2 mb-2">
                            <input type="text" value="${escapeHtml(card.name)}" placeholder="Élève ${index + 1}"
                                onchange="updateCardName(${index}, this.value)"
                                class="bg-black/30 text-white font-black text-xl md:text-2xl rounded-xl px-3 py-1 w-full focus:outline-none focus:bg-black/60 placeholder-white/40 truncate border border-transparent focus:border-white/30">
                            
                            <span class="text-xs font-extrabold uppercase px-2.5 py-1 rounded-full border ${badgeClass} shrink-0">
                                ${badgeText}
                            </span>

                            <button onclick="removeCard(${index})" class="text-white/40 hover:text-rose-400 font-bold px-2 py-1 rounded-lg hover:bg-black/30 transition text-xs">
                                ✖
                            </button>
                        </div>

                        <!-- REGLAGES VMA & CIBLE 360M -->
                        <div class="flex items-center justify-between gap-2 bg-black/30 p-2 rounded-xl border border-white/10 mb-3">
                            <div class="flex items-center gap-1.5 w-1/2">
                                <span class="text-xs font-black text-white/70">VMA:</span>
                                <input type="number" step="0.5" value="${card.vma}" placeholder="12"
                                    onchange="updateCardVMA(${index}, this.value)"
                                    class="bg-black/50 text-white font-bold text-sm rounded-lg px-2 py-0.5 w-16 text-center focus:outline-none">
                                <span class="text-xs text-white/60">km/h</span>
                            </div>
                            <div class="flex items-center gap-1.5 w-1/2 justify-end">
                                <select onchange="updateCardVMAPercent(${index}, this.value)" class="bg-black/50 text-indigo-200 font-bold text-xs rounded-lg px-2 py-1 focus:outline-none">
                                    ${[80, 90, 100, 110, 120, 130].map(p => `<option value="${p}" ${card.vmaPercent == p ? 'selected' : ''}>${p}%</option>`).join('')}
                                </select>
                            </div>
                        </div>

                        <!-- CIBLE 360M -->
                        <div class="text-center bg-black/20 rounded-xl py-1 mb-3 border border-white/5">
                            <span class="text-xs font-extrabold text-white/80">Cible 360m : </span>
                            <span class="text-sm font-black text-amber-300 mono-time">(${targetTime})</span>
                        </div>

                        <!-- CHRONOMÈTRE DE COURSE GÉANT -->
                        <div class="text-center py-2 bg-black/40 rounded-2xl border border-white/10 mb-3 shadow-inner">
                            <div class="text-[10px] uppercase font-black tracking-widest text-white/50 mb-0.5">Temps de Course</div>
                            <div class="text-4xl md:text-5xl font-black text-white mono-time tracking-tight leading-none" id="display-course-${index}">
                                ${cTime.main}<span class="text-2xl md:text-3xl text-white/60">${cTime.ms}</span>
                            </div>
                        </div>

                        <!-- TEMPS DE PAUSE ACTIF / CONSERVÉ -->
                        <div class="text-center py-1.5 bg-black/25 rounded-xl border border-white/5 mb-3 min-h-[46px] flex flex-col justify-center">
                            <div class="text-[10px] uppercase font-bold text-white/40">Durée de Pause</div>
                            <div class="text-xl md:text-2xl font-black mono-time ${card.isPaused ? 'blinking-pause' : 'text-amber-300/80'}" id="display-pause-${index}">
                                ${card.pauseTime > 0 ? pTime.main + pTime.ms : '--:--'}
                            </div>
                        </div>
                    </div>

                    <!-- BOUTONS D'ACTION -->
                    <div class="grid grid-cols-5 gap-2">
                        <button onclick="handleMainButton(${index})" class="col-span-4 py-3 rounded-xl font-black text-sm md:text-base uppercase tracking-wider shadow-lg transition transform active:scale-95 ${getButtonStyle(card)}">
                            ${getButtonText(card)}
                        </button>
                        <button onclick="resetCard(${index})" class="col-span-1 bg-black/40 hover:bg-black/60 text-white/80 hover:text-white font-bold rounded-xl flex items-center justify-center text-base border border-white/10 transition">
                            ↺
                        </button>
                    </div>
                `;
                grid.appendChild(cardEl);
            });
        }

        function getButtonText(card) {
            if (!card.isRunning && !card.isPaused) return "▶️ Start";
            if (card.isRunning) return "⏸️ Pause";
            if (card.isPaused) return "▶️ Relancer (0)";
        }

        function getButtonStyle(card) {
            if (!card.isRunning && !card.isPaused) return "bg-emerald-500 hover:bg-emerald-400 text-slate-950";
            if (card.isRunning) return "bg-amber-400 hover:bg-amber-300 text-slate-950";
            if (card.isPaused) return "bg-emerald-400 hover:bg-emerald-300 text-slate-950 animate-pulse";
        }

        function updateActiveTimers() {
            const now = Date.now();
            cards.forEach((card, index) => {
                if (card.isRunning) {
                    card.courseTime = now - card.startTime;
                    const el = document.getElementById(`display-course-${index}`);
                    if (el) {
                        const t = formatTimeDisplay(card.courseTime);
                        el.innerHTML = `${t.main}<span class="text-2xl md:text-3xl text-white/60">${t.ms}</span>`;
                    }
                } else if (card.isPaused) {
                    card.pauseTime = now - card.pauseStartTime;
                    const el = document.getElementById(`display-pause-${index}`);
                    if (el) {
                        const t = formatTimeDisplay(card.pauseTime);
                        el.innerText = `${t.main}${t.ms}`;
                    }
                }
            });
        }

        function handleMainButton(index) {
            const card = cards[index];
            const now = Date.now();

            if (!card.isRunning && !card.isPaused) {
                card.isRunning = true;
                card.startTime = now - card.courseTime;
            } else if (card.isRunning) {
                card.isRunning = false;
                card.isPaused = true;
                card.pauseStartTime = now;
                card.pauseCount = card.courseCount;
            } else if (card.isPaused) {
                card.history.push({
                    courseNum: card.courseCount, courseTime: card.courseTime,
                    pauseNum: card.pauseCount, pauseTime: card.pauseTime
                });
                card.courseCount++;
                card.courseTime = 0;
                card.isRunning = true;
                card.isPaused = false;
                card.startTime = now;
            }
            saveData();
            renderGrid();
        }

        function resetCard(index) {
            const name = cards[index].name;
            const vma = cards[index].vma;
            cards[index] = createCardObject(index, name, vma);
            saveData();
            renderGrid();
        }

        function updateCardName(index, name) { cards[index].name = name; saveData(); }
        function updateCardVMA(index, vma) { cards[index].vma = vma; saveData(); renderGrid(); }
        function updateCardVMAPercent(index, pct) { cards[index].vmaPercent = pct; saveData(); renderGrid(); }

        function setGlobalVMAPercent(pct) {
            cards.forEach(c => c.vmaPercent = pct);
            saveData();
            renderGrid();
        }

        function startAll() { cards.forEach((c, idx) => { if (!c.isRunning) handleMainButton(idx); }); }
        function pauseAll() { cards.forEach((c, idx) => { if (c.isRunning) handleMainButton(idx); }); }
        function resetAllConfirm() { if (confirm("Remettre à zéro TOUS les chronomètres ?")) cards.forEach((c, idx) => resetCard(idx)); }

        function sendDataToProfDirect() {
            bc.postMessage({ type: 'SYNC_DATA', payload: cards });
            const now = new Date().toLocaleTimeString();
            document.getElementById('status-synchro').innerText = `✅ Résultats transmis au Prof à ${now}`;
            alert(`✅ Résultats de la ${currentRole.toUpperCase()} envoyés avec succès au Professeur !`);
        }

        function mergeReceivedData(receivedCards) {
            receivedCards.forEach(rc => {
                if (rc && rc.id >= 0) {
                    cards[rc.id] = { ...rc };
                }
            });
            saveData();
            renderGrid();
            const now = new Date().toLocaleTimeString();
            document.getElementById('status-synchro').innerText = `🔄 Dernières données reçues à ${now}`;
        }

        function setRole(role) {
            currentRole = role;
            ['prof', 'tab1', 'tab2', 'tab3', 'tab4'].forEach(r => {
                const btn = document.getElementById(`btn-role-${r}`);
                if (btn) btn.className = r === role ? "px-2.5 py-1 rounded-lg text-xs font-bold bg-indigo-600 text-white" : "px-2.5 py-1 rounded-lg text-xs font-bold text-slate-400";
            });

            if (role === 'prof') {
                document.getElementById('tab-send-banner').classList.add('hidden');
                document.getElementById('prof-controls').classList.remove('hidden');
            } else {
                document.getElementById('tab-send-banner').classList.remove('hidden');
                document.getElementById('prof-controls').classList.add('hidden');
            }
            renderGrid();
        }

        function exportCSV() {
            let maxCourses = 0;
            cards.forEach(c => {
                let count = c.history.length + (c.courseTime > 0 ? 1 : 0);
                if (count > maxCourses) maxCourses = count;
            });

            let headers = ["Eleve", "VMA (km/h)", "% VMA Visé", "Temps Cible 360m"];
            for (let i = 1; i <= Math.max(maxCourses, 1); i++) {
                headers.push(`Course ${i}`, `Pause ${i}`);
            }

            let csvRows = [headers.join(",")];

            cards.forEach(c => {
                if (!c.name && c.courseTime === 0) return;
                let target = getTargetTimeFormatted(c.vma, c.vmaPercent);
                let row = [`"${c.name || 'Élève'}"`, c.vma || "", `${c.vmaPercent}%`, `"${target}"`];

                c.history.forEach(h => {
                    const ct = formatTimeDisplay(h.courseTime);
                    const pt = formatTimeDisplay(h.pauseTime);
                    row.push(`"${ct.main}${ct.ms}"`, `"${pt.main}${pt.ms}"`);
                });

                if (c.courseTime > 0 && !c.history.some(h => h.courseNum === c.courseCount)) {
                    const ct = formatTimeDisplay(c.courseTime);
                    const pt = c.pauseTime > 0 ? formatTimeDisplay(c.pauseTime) : { main: "En cours", ms: "" };
                    row.push(`"${ct.main}${ct.ms}"`, `"${pt.main}${pt.ms}"`);
                }

                csvRows.push(row.join(","));
            });

            const blob = new Blob([csvRows.join("\n")], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Bilan_EPS_Chronos_${new Date().toISOString().slice(0,10)}.csv`;
            a.click();
        }

        function processImport() {
            const raw = document.getElementById('import-text').value.trim();
            if (!raw) return closeModal('importModal');
            const lines = raw.split(/\r?\n/).filter(l => l.trim() !== '');
            
            // Ajuster le nombre de cartes si le nombre d'élèves importé dépasse la taille actuelle
            if (lines.length > cards.length) {
                createDefaultCards(lines.length);
            }

            lines.forEach((line, idx) => {
                const parts = line.split(/[,;]/);
                cards[idx].name = parts[0].trim();
                if (parts.length > 1) cards[idx].vma = parts[1].trim();
            });

            saveData();
            renderGrid();
            closeModal('importModal');
        }

        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
        function escapeHtml(str) { return str ? str.replace(/"/g, "&quot;") : ''; }

        window.onload = initApp;
    </script>
</body>
</html>
