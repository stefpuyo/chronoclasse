<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chrono EPS - 100% Hors Ligne</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #ffffff;
            --accent: #4ade80;
            --danger: #f87171;
            --pause-color: #facc15;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }
        h1 { text-align: center; font-size: 2rem; margin-bottom: 10px; }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
            background: #2a2a2a;
            padding: 15px;
            border-radius: 10px;
        }
        button {
            padding: 10px 20px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover { opacity: 0.8; }
        .btn-primary { background: #3b82f6; color: white; }
        .btn-success { background: var(--accent); color: #121212; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-sync { background: #a855f7; color: white; }
        
        /* Grille : 5 cartes par ligne sur grand écran */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
        }
        @media (min-width: 1400px) {
            .grid { grid-template-columns: repeat(5, 1fr); }
        }

        /* Cartes colorées */
        .card {
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            border: 3px solid rgba(255,255,255,0.1);
        }
        .name-input {
            font-size: 1.5rem;
            font-weight: 900;
            text-align: center;
            background: transparent;
            border: none;
            color: white;
            width: 100%;
            margin-bottom: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.3);
        }
        .vma-group {
            display: flex;
            gap: 5px;
            margin-bottom: 10px;
            width: 100%;
            justify-content: space-between;
        }
        .vma-group input, .vma-group select {
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            padding: 5px;
            border-radius: 5px;
            font-size: 1rem;
        }
        .vma-group input { width: 45%; }
        .vma-group select { width: 50%; }
        
        .target-time {
            font-size: 1.1rem;
            font-weight: bold;
            color: #d1d5db;
            margin-bottom: 10px;
        }

        /* Chiffres géants */
        .timer-display {
            font-size: 3rem;
            font-family: monospace;
            font-weight: 900;
            margin: 10px 0;
            letter-spacing: -1px;
        }
        
        .pause-display {
            font-size: 1.5rem;
            font-family: monospace;
            font-weight: bold;
            color: var(--pause-color);
            height: 30px;
        }

        /* Animation clignotement pour la pause */
        .blinking {
            animation: blinker 1s linear infinite;
            color: var(--pause-color);
            text-shadow: 0 0 10px var(--pause-color);
        }
        @keyframes blinker {
            50% { opacity: 0.2; }
        }

        .status-badge {
            background: rgba(0,0,0,0.5);
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.9rem;
            margin-bottom: 10px;
        }

        .card-controls {
            display: flex;
            gap: 10px;
            width: 100%;
            margin-top: 10px;
        }
        .card-controls button { flex: 1; padding: 15px 0; font-size: 1.2rem; }

        /* Modal Import/Export */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            width: 90%;
            max-width: 600px;
        }
        .modal-content textarea {
            width: 100%;
            height: 150px;
            margin-bottom: 10px;
            background: #121212;
            color: white;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <h1>⏱️ Chrono EPS - Hors Ligne</h1>
    
    <div class="controls">
        <button class="btn-primary" onclick="addCard()">+ Ajouter Élève</button>
        <button class="btn-primary" onclick="openImportModal()">📥 Import Prénoms</button>
        <button class="btn-success" onclick="exportCSV()">📊 Exporter CSV (Bilan)</button>
        <button class="btn-sync" onclick="openSyncModal()">🔄 Synchro Multi-Tablettes</button>
    </div>

    <div class="grid" id="chrono-container"></div>

    <!-- Modal Import Prénoms -->
    <div id="importModal" class="modal">
        <div class="modal-content">
            <h2>Importer Élèves (Copier-Coller)</h2>
            <p>Collez la liste (Prénom, VMA). Un élève par ligne.</p>
            <textarea id="importText" placeholder="Ex:\nEmma, 12\nLucas, 13.5\nLéa"></textarea>
            <div style="display: flex; gap: 10px;">
                <button class="btn-success" onclick="processImport()">Importer</button>
                <button class="btn-danger" onclick="closeModals()">Annuler</button>
            </div>
        </div>
    </div>

    <!-- Modal Synchronisation Hors Ligne -->
    <div id="syncModal" class="modal">
        <div class="modal-content">
            <h2>🔄 Synchronisation (Hors Ligne)</h2>
            <p><strong>Élèves :</strong> Générez le code et envoyez-le au professeur (AirDrop/Copier).</p>
            <button class="btn-primary" style="width: 100%; margin-bottom:10px;" onclick="generateSyncData()">1. Générer mes résultats</button>
            <textarea id="syncText" placeholder="Les données chiffrées apparaîtront ici..."></textarea>
            
            <p><strong>Professeur :</strong> Collez les données reçues d'une tablette ici et validez.</p>
            <button class="btn-success" style="width: 100%; margin-bottom:10px;" onclick="importSyncData()">2. Fusionner les résultats reçus</button>
            <button class="btn-danger" onclick="closeModals()">Fermer</button>
        </div>
    </div>

    <script>
        // Couleurs de fond pour les 20 cartes
        const colors = ['#831843', '#701a75', '#4c1d95', '#312e81', '#1e3a8a', '#0c4a6e', '#064e3b', '#14532d', '#451a03', '#7f1d1d', '#581c87', '#0f766e', '#b45309', '#1d4ed8', '#047857', '#be123c', '#4338ca', '#0369a1', '#15803d', '#a16207'];
        
        let cards = [];

        function createCard(id, name = '', vma = '') {
            const color = colors[id % colors.length];
            return {
                id, name, vma, vmaPercent: 100,
                courseCount: 1, pauseCount: 0,
                courseTime: 0, pauseTime: 0,
                courseInterval: null, pauseInterval: null,
                isRunning: false, isPaused: false,
                history: [], color
            };
        }

        // Initialisation ou récupération du localStorage
        function loadData() {
            const saved = localStorage.getItem('eps_chronos');
            if (saved) {
                cards = JSON.parse(saved);
                // Réinitialiser les intervalles qui ne peuvent pas être stockés
                cards.forEach(c => { c.courseInterval = null; c.pauseInterval = null; });
            } else {
                for(let i=0; i<20; i++) cards.push(createCard(i));
            }
            render();
        }

        function saveData() {
            localStorage.setItem('eps_chronos', JSON.stringify(cards));
        }

        function formatTime(ms) {
            if (ms === 0) return "00:00.0";
            const d = new Date(ms);
            const m = d.getUTCMinutes().toString().padStart(2, '0');
            const s = d.getUTCSeconds().toString().padStart(2, '0');
            const ms_short = Math.floor(d.getUTCMilliseconds() / 100);
            return `${m}:${s}.${ms_short}`;
        }

        function calculateTarget(vma, percent) {
            if (!vma || isNaN(vma)) return '--:--';
            const speedKmH = (parseFloat(vma) * parseInt(percent)) / 100;
            if (speedKmH <= 0) return '--:--';
            const speedMS = speedKmH / 3.6;
            const timeS = 360 / speedMS;
            return formatTime(timeS * 1000).split('.')[0]; // Retire les dixièmes pour la cible
        }

        function render() {
            const container = document.getElementById('chrono-container');
            container.innerHTML = '';

            cards.forEach((card, index) => {
                const target = calculateTarget(card.vma, card.vmaPercent);
                
                const div = document.createElement('div');
                div.className = 'card';
                div.style.backgroundColor = card.color;
                
                let statusText = card.isPaused ? `Pause ${card.pauseCount}` : `Course ${card.courseCount}`;
                let actionBtn = '';
                
                if (!card.isRunning && !card.isPaused) {
                    actionBtn = `<button class="btn-success" onclick="toggleTimer(${index})">▶️ START</button>`;
                } else if (card.isRunning) {
                    actionBtn = `<button class="btn-danger" onclick="toggleTimer(${index})">⏸️ PAUSE</button>`;
                } else if (card.isPaused) {
                    actionBtn = `<button class="btn-success" onclick="toggleTimer(${index})">▶️ RE-START (0)</button>`;
                }

                div.innerHTML = `
                    <input type="text" class="name-input" value="${card.name}" placeholder="Élève ${index+1}" onchange="updateName(${index}, this.value)">
                    
                    <div class="vma-group">
                        <input type="number" step="0.5" placeholder="VMA" value="${card.vma}" onchange="updateVMA(${index}, this.value)">
                        <select onchange="updatePercent(${index}, this.value)">
                            ${[80, 90, 100, 110, 120, 130].map(p => `<option value="${p}" ${card.vmaPercent == p ? 'selected' : ''}>${p}% VMA</option>`).join('')}
                        </select>
                    </div>
                    
                    <div class="target-time">Cible 360m: (${target})</div>
                    
                    <div class="status-badge">${statusText}</div>
                    
                    <div class="timer-display" id="course-${index}">${formatTime(card.courseTime)}</div>
                    <div class="pause-display ${card.isPaused ? 'blinking' : ''}" id="pause-${index}">
                        ${card.pauseTime > 0 ? formatTime(card.pauseTime) : ''}
                    </div>

                    <div class="card-controls">
                        ${actionBtn}
                        <button style="background:#4b5563; color:white;" onclick="resetCard(${index})">↺</button>
                    </div>
                `;
                container.appendChild(div);
            });
            saveData();
        }

        function updateName(index, val) { cards[index].name = val; saveData(); }
        function updateVMA(index, val) { cards[index].vma = val; render(); }
        function updatePercent(index, val) { cards[index].vmaPercent = val; render(); }

        function toggleTimer(index) {
            const card = cards[index];

            if (!card.isRunning && !card.isPaused) {
                // Lancer Course 1
                card.isRunning = true;
                const startTime = Date.now() - card.courseTime;
                card.courseInterval = setInterval(() => {
                    card.courseTime = Date.now() - startTime;
                    document.getElementById(`course-${index}`).innerText = formatTime(card.courseTime);
                }, 100);
            } 
            else if (card.isRunning) {
                // Mettre en Pause (Enregistre la course, lance la pause)
                clearInterval(card.courseInterval);
                card.isRunning = false;
                card.isPaused = true;
                card.pauseCount = card.courseCount;
                
                const startPause = Date.now();
                card.pauseInterval = setInterval(() => {
                    card.pauseTime = Date.now() - startPause;
                    const pDisplay = document.getElementById(`pause-${index}`);
                    if(pDisplay) pDisplay.innerText = formatTime(card.pauseTime);
                }, 100);
            }
            else if (card.isPaused) {
                // Relancer une nouvelle course (Arrête la pause, relance à 0)
                clearInterval(card.pauseInterval);
                
                // Sauvegarde historique
                card.history.push({
                    course: card.courseCount,
                    courseTime: card.courseTime,
                    pauseTime: card.pauseTime
                });

                card.isPaused = false;
                card.isRunning = true;
                card.courseCount++;
                card.courseTime = 0;
                // On garde card.pauseTime intact pour qu'il reste affiché sur la carte !
                
                const startTime = Date.now();
                card.courseInterval = setInterval(() => {
                    card.courseTime = Date.now() - startTime;
                    document.getElementById(`course-${index}`).innerText = formatTime(card.courseTime);
                }, 100);
            }
            render();
        }

        function resetCard(index) {
            clearInterval(cards[index].courseInterval);
            clearInterval(cards[index].pauseInterval);
            const id = cards[index].id;
            const name = cards[index].name;
            const vma = cards[index].vma;
            cards[index] = createCard(id, name, vma);
            render();
        }

        // --- EXPORT CSV (1 ligne par élève) ---
        function exportCSV() {
            let csv = "Eleve,VMA,Objectif 360m";
            
            // Trouver le nombre max de courses pour générer les colonnes dynamiquement
            let maxCourses = 0;
            cards.forEach(c => {
                let total = c.history.length + (c.courseTime > 0 ? 1 : 0);
                if (total > maxCourses) maxCourses = total;
            });

            for(let i=1; i<=maxCourses; i++) {
                csv += `,Course ${i},Pause ${i}`;
            }
            csv += "\n";

            cards.forEach(c => {
                if (!c.name && c.courseTime === 0) return; // Ignorer cartes vides
                let row = `${c.name || 'Inconnu'},${c.vma},${calculateTarget(c.vma, c.vmaPercent)}`;
                
                c.history.forEach(h => {
                    row += `,${formatTime(h.courseTime)},${formatTime(h.pauseTime)}`;
                });
                
                if (c.courseTime > 0 && !c.history.some(h => h.course === c.courseCount)) {
                     row += `,${formatTime(c.courseTime)},${c.isPaused ? formatTime(c.pauseTime) : 'En cours'}`;
                }
                csv += row + "\n";
            });

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = "Bilan_EPS_Chronos.csv";
            link.click();
        }

        // --- IMPORT COPIER-COLLER ---
        function openImportModal() { document.getElementById('importModal').style.display = 'flex'; }
        function closeModals() { 
            document.getElementById('importModal').style.display = 'none'; 
            document.getElementById('syncModal').style.display = 'none';
        }
        
        function processImport() {
            const text = document.getElementById('importText').value.trim();
            if (!text) return closeModals();
            
            const lines = text.split('\n');
            let insertIndex = 0;
            
            lines.forEach(line => {
                if(line.trim() === '') return;
                let parts = line.split(/[;,]/);
                let name = parts[0].trim();
                let vma = parts.length > 1 ? parts[1].trim() : '';
                
                if (insertIndex >= cards.length) cards.push(createCard(cards.length));
                cards[insertIndex].name = name;
                cards[insertIndex].vma = vma;
                insertIndex++;
            });
            closeModals();
            render();
        }

        // --- SYNCHRO HORS LIGNE (MULTI-TABLETTES) ---
        function openSyncModal() { document.getElementById('syncModal').style.display = 'flex'; }
        
        function generateSyncData() {
            // Ne garder que les cartes avec un nom ou des temps pour alléger les données
            const activeData = cards.filter(c => c.name !== '' || c.courseTime > 0);
            
            // On nettoie les objets cycliques (intervalles) avant l'export
            const cleanData = activeData.map(c => {
                let clone = { ...c };
                delete clone.courseInterval;
                delete clone.pauseInterval;
                return clone;
            });

            const dataStr = JSON.stringify(cleanData);
            const textArea = document.getElementById('syncText');
            textArea.value = dataStr;
            
            // Tente de copier dans le presse-papier
            textArea.select();
            document.execCommand('copy');
            alert("✅ Données générées et copiées ! \n\nVous pouvez maintenant les envoyer par AirDrop/Bluetooth au Professeur, ou lui faire scanner ce texte.");
        }

        function importSyncData() {
            const text = document.getElementById('syncText').value.trim();
            if(!text) return;
            try {
                const receivedCards = JSON.parse(text);
                receivedCards.forEach(rc => {
                    // Cherche une carte vide ou avec le même nom
                    let targetIndex = cards.findIndex(c => c.name === rc.name);
                    if (targetIndex === -1) targetIndex = cards.findIndex(c => c.name === '' && c.courseTime === 0);
                    if (targetIndex === -1) {
                        targetIndex = cards.length;
                        cards.push(createCard(targetIndex));
                    }
                    cards[targetIndex] = { ...rc, courseInterval: null, pauseInterval: null, color: cards[targetIndex].color };
                });
                alert("✅ Données fusionnées avec succès !");
                closeModals();
                render();
            } catch(e) {
                alert("❌ Erreur : Format de données invalide.");
            }
        }

        window.onload = loadData;
    </script>
</body>
</html>
